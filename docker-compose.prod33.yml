# Production API on 80.87.196.33 — port 8111 (8091–8099 = masterdoc)
# Front nginx on 91.207.75.72 proxies gosphoto.ru /api/ → http://80.87.196.33:8111/
services:
  gosphoto-gate:
    build: .
    image: gosphoto-gate:latest
    container_name: gosphoto-gate
    restart: unless-stopped
    ports:
      - "8111:8091"
    env_file:
      - .env
    environment:
      GATE_MODEL_PATH: /app/models/face_landmarker.task
      SELFIE_SEGMENTER_PATH: /app/models/selfie_segmenter.tflite
      GATE_CORS_ORIGINS: "https://gosphoto.ru,https://www.gosphoto.ru"
      GATE_MAX_UPLOAD_BYTES: "20971520"
      GATE_MIN_BLUR_VARIANCE: "10"
      GATE_MAX_YAW_DEG: "25"
      GATE_MAX_PITCH_DEG: "25"
      GATE_MAX_ROLL_DEG: "28"
      EDIT_BACKEND: ${EDIT_BACKEND:-riverflow}
      SKIP_EDIT_IF_READY: ${SKIP_EDIT_IF_READY:-0}
      # 33 IP blocked by OpenRouter — egress via nginx proxy on 91
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-http://91.207.75.72:8787/api/v1}
      OPENROUTER_TIMEOUT_SEC: ${OPENROUTER_TIMEOUT_SEC:-300}
      RIVERFLOW_MODEL: ${RIVERFLOW_MODEL:-google/gemini-2.5-flash-image}
      RIVERFLOW_PRO_MODEL: ${RIVERFLOW_PRO_MODEL:-sourceful/riverflow-v2.5-pro}
      EDIT_ROUTE_PRO_ON_MESSY_HAIR: ${EDIT_ROUTE_PRO_ON_MESSY_HAIR:-0}
      RIVERFLOW_BG_MODE: ${RIVERFLOW_BG_MODE:-solid}
      RIVERFLOW_BG_HEX: "${RIVERFLOW_BG_HEX:-#FFFFFF}"
      RIVERFLOW_IMAGE_SIZE: ${RIVERFLOW_IMAGE_SIZE:-1K}
      RIVERFLOW_REASONING: ${RIVERFLOW_REASONING:-medium}
      RIVERFLOW_TIMEOUT_SEC: ${RIVERFLOW_TIMEOUT_SEC:-300}
      # Local ONNX fallback if Riverflow fails
      EDIT_CUTOUT: ${EDIT_CUTOUT:-silueta}
      U2NETP_MODEL_PATH: /app/models/u2netp.onnx
      SILUETA_MODEL_PATH: /app/models/silueta.onnx
      U2NET_MODEL_PATH: /app/models/u2net.onnx
      ISNET_MODEL_PATH: /app/models/isnet-general-use.onnx
      REJECTEDS_DIR: /app/rejecteds
      PAIRS_DIR: /app/pairs
      RESULTS_DIR: /app/results
      PAYMENTS_DIR: /app/payments
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://gosphoto.ru}
      PRICE_KOPECKS: ${PRICE_KOPECKS:-15000}
      RESUME_PRICE_KOPECKS: ${RESUME_PRICE_KOPECKS:-30000}
      RESUME_UPSELL_ENABLED: ${RESUME_UPSELL_ENABLED:-1}
      POSE_MODEL_PATH: /app/models/pose_landmarker_lite.task
      FREE_DOWNLOAD_UNLOCK: ${FREE_DOWNLOAD_UNLOCK:-0}
      PAYMENT_SYNC_INTERVAL_SECONDS: ${PAYMENT_SYNC_INTERVAL_SECONDS:-30}
    volumes:
      - ./rejecteds:/app/rejecteds
      - ./pairs:/app/pairs
      - ./results:/app/results
      - ./payments:/app/payments
    # isnet@1024 needs more headroom than u2net@320
    mem_limit: 3072m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
