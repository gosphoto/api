name: Deploy gosphoto API

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-gosphoto-api-${{ github.ref }}
  cancel-in-progress: false

env:
  # Prod API (nginx on 91 proxies gosphoto.ru /api/ here)
  DEPLOY_HOST: 80.87.196.33
  API_PATH: /opt/gosphoto-api
  COMPOSE_FILE: docker-compose.prod33.yml

jobs:
  check:
    name: Check API files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.prod33.yml
          test -f app/main.py
          test -f app/gate.py
          test -f app/openrouter.py
          test -f app/crop.py
          test -f app/feedback.py
          test -f tests/test_crop_regression.py
          test -d tests/fixtures/crop_regression
          test -f tests/test_upright_regression.py
          test -f tests/test_gate_upright.py
          test -d tests/fixtures/upright_regression
          test -f tests/fixtures/upright_regression/inverted_selfie/in.jpg
          echo "API OK"

  test:
    name: Unit + crop regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          pip install -r requirements.txt pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Download Face Landmarker model
        run: |
          mkdir -p models
          curl -fsSL \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            -o models/face_landmarker.task

      - name: Pytest
        env:
          GATE_MODEL_PATH: ${{ github.workspace }}/models/face_landmarker.task
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests/ -v --tb=short

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [check, test]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          test -n "$KEY" || { echo "Add repository secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$USER_NAME" || { echo "Add repository secret DEPLOY_USER"; exit 1; }
          test -n "$SMTP_PASSWORD" || { echo "Add repository secret SMTP_PASSWORD"; exit 1; }

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare directory
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${API_PATH}"

      - name: Rsync API
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'models' \
            --exclude 'rejecteds' \
            --exclude 'pairs' \
            --exclude 'results' \
            --exclude 'tmp-smoke' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.env.example' \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            ./ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${API_PATH}/"

      - name: Upsert secrets and start container
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FEEDBACK_TO: ${{ secrets.FEEDBACK_TO }}
          TOCHKA_ACCESS_TOKEN: ${{ secrets.TOCHKA_ACCESS_TOKEN }}
          TOCHKA_CUSTOMER_CODE: ${{ secrets.TOCHKA_CUSTOMER_CODE }}
          TOCHKA_MERCHANT_ID: ${{ secrets.TOCHKA_MERCHANT_ID }}
        run: |
          set -euo pipefail
          MODEL="${OPENROUTER_IMAGE_MODEL:-openai/gpt-image-1}"
          SMTP_HOST_VAL="${SMTP_HOST:-mail.antonbutov.com}"
          SMTP_PORT_VAL="${SMTP_PORT:-587}"
          SMTP_USER_VAL="${SMTP_USER:-mail@antonbutov.com}"
          SMTP_FROM_VAL="${SMTP_FROM:-mail@antonbutov.com}"
          FEEDBACK_TO_VAL="${FEEDBACK_TO:-mail@antonbutov.com}"

          # Preserve existing .env keys (OPENROUTER_BASE_URL, RIVERFLOW_*, …);
          # only upsert keys we manage from GitHub secrets.
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; python3 -" <<PY
          from pathlib import Path
          path = Path("${API_PATH}/.env")
          data = {}
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                      continue
                  k, _, v = line.partition("=")
                  data[k.strip()] = v
          updates = {
              "OPENROUTER_API_KEY": """${OPENROUTER_API_KEY}""",
              "OPENROUTER_IMAGE_MODEL": """${MODEL}""",
              "OPENROUTER_TRANSPARENT_BG": "1",
              "SMTP_HOST": """${SMTP_HOST_VAL}""",
              "SMTP_PORT": """${SMTP_PORT_VAL}""",
              "SMTP_USER": """${SMTP_USER_VAL}""",
              "SMTP_PASSWORD": """${SMTP_PASSWORD}""",
              "SMTP_FROM": """${SMTP_FROM_VAL}""",
              "FEEDBACK_TO": """${FEEDBACK_TO_VAL}""",
              "TOCHKA_ACCESS_TOKEN": """${TOCHKA_ACCESS_TOKEN}""",
              "TOCHKA_CUSTOMER_CODE": """${TOCHKA_CUSTOMER_CODE}""",
              "TOCHKA_MERCHANT_ID": """${TOCHKA_MERCHANT_ID}""",
          }
          for k, v in updates.items():
              if v != "":
                  data[k] = v
          # Sensible defaults if never set on this host
          data.setdefault("OPENROUTER_BASE_URL", "http://91.207.75.72:8787/api/v1")
          data["EDIT_BACKEND"] = "riverflow"
          data["RIVERFLOW_MODEL"] = "black-forest-labs/flux.2-pro"
          data.setdefault("RIVERFLOW_BG_MODE", "solid")
          data.setdefault("RIVERFLOW_BG_HEX", "#FFFFFF")
          data.setdefault("OPENROUTER_TIMEOUT_SEC", "300")
          data.setdefault("RIVERFLOW_TIMEOUT_SEC", "300")
          data.setdefault("PUBLIC_BASE_URL", "https://gosphoto.ru")
          data.setdefault("PRICE_KOPECKS", "7000")
          data.setdefault("FREE_DOWNLOAD_UNLOCK", "0")
          data.setdefault("PAYMENT_SYNC_INTERVAL_SECONDS", "30")

          # Resolve customerCode from Tochka using JWT if missing
          token = (data.get("TOCHKA_ACCESS_TOKEN") or "").strip()
          if token and not (data.get("TOCHKA_CUSTOMER_CODE") or "").strip():
              import json
              import urllib.request
              try:
                  req = urllib.request.Request(
                      "https://enter.tochka.com/uapi/open-banking/v1.0/customers",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/json",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      root = json.loads(resp.read().decode("utf-8"))
                  payload = root.get("Data") if isinstance(root, dict) else None
                  code = ""
                  if isinstance(payload, dict):
                      code = str(payload.get("customerCode") or "").strip()
                      if not code:
                          raw = payload.get("Customer")
                          customers = []
                          if isinstance(raw, dict):
                              customers = [raw]
                          elif isinstance(raw, list):
                              customers = [c for c in raw if isinstance(c, dict)]
                          business = [
                              c for c in customers
                              if str(c.get("customerType") or "").lower() == "business"
                              and str(c.get("customerCode") or "").strip()
                          ]
                          if len(business) == 1:
                              code = str(business[0]["customerCode"]).strip()
                          elif len(customers) == 1:
                              code = str(customers[0].get("customerCode") or "").strip()
                  if code:
                      data["TOCHKA_CUSTOMER_CODE"] = code
                      print("resolved TOCHKA_CUSTOMER_CODE=", code)
                  else:
                      print("WARN: could not resolve TOCHKA_CUSTOMER_CODE")
              except Exception as e:
                  print("WARN: Tochka customer resolve failed:", e)

          text = "\n".join(f"{k}={v}" for k, v in data.items()) + "\n"
          path.write_text(text, encoding="utf-8")
          path.chmod(0o600)
          print("env keys:", ", ".join(sorted(data)))
          PY

          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${API_PATH} && docker compose -f ${COMPOSE_FILE} up -d --build"

      - name: Smoke health
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'for i in $(seq 1 36); do
               curl -fsS http://127.0.0.1:8111/health >/dev/null && break
               sleep 5
             done
             curl -fsS http://127.0.0.1:8111/health
             curl -fsS https://gosphoto.ru/health
             curl -fsS https://gosphoto.ru/api/feedback'
