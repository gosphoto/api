name: Deploy gosphoto API

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-gosphoto-api-${{ github.ref }}
  cancel-in-progress: false

env:
  # Prod API (nginx on 91 proxies gosphoto.ru /api/ here)
  DEPLOY_HOST: 80.87.196.33
  API_PATH: /opt/gosphoto-api
  COMPOSE_FILE: docker-compose.prod33.yml

jobs:
  check:
    name: Check API files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          test -f docker-compose.prod33.yml
          test -f app/main.py
          test -f app/gate.py
          test -f app/openrouter.py
          test -f app/crop.py
          test -f app/feedback.py
          echo "API OK"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          test -n "$KEY" || { echo "Add repository secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$USER_NAME" || { echo "Add repository secret DEPLOY_USER"; exit 1; }
          test -n "$SMTP_PASSWORD" || { echo "Add repository secret SMTP_PASSWORD"; exit 1; }

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare directory
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${API_PATH}"

      - name: Rsync API
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude '__pycache__' \
            --exclude '.venv' \
            --exclude 'models' \
            --exclude 'rejecteds' \
            --exclude 'pairs' \
            --exclude 'results' \
            --exclude 'tmp-smoke' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude '.env.example' \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            ./ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${API_PATH}/"

      - name: Upsert secrets and start container
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_IMAGE_MODEL: ${{ secrets.OPENROUTER_IMAGE_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          FEEDBACK_TO: ${{ secrets.FEEDBACK_TO }}
        run: |
          set -euo pipefail
          MODEL="${OPENROUTER_IMAGE_MODEL:-openai/gpt-image-1}"
          SMTP_HOST_VAL="${SMTP_HOST:-mail.antonbutov.com}"
          SMTP_PORT_VAL="${SMTP_PORT:-587}"
          SMTP_USER_VAL="${SMTP_USER:-mail@antonbutov.com}"
          SMTP_FROM_VAL="${SMTP_FROM:-mail@antonbutov.com}"
          FEEDBACK_TO_VAL="${FEEDBACK_TO:-mail@antonbutov.com}"

          # Preserve existing .env keys (OPENROUTER_BASE_URL, NANO_BANANA_MODEL, …);
          # only upsert keys we manage from GitHub secrets.
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "umask 077; python3 -" <<PY
          from pathlib import Path
          path = Path("${API_PATH}/.env")
          data = {}
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip() or line.lstrip().startswith("#") or "=" not in line:
                      continue
                  k, _, v = line.partition("=")
                  data[k.strip()] = v
          updates = {
              "OPENROUTER_API_KEY": """${OPENROUTER_API_KEY}""",
              "OPENROUTER_IMAGE_MODEL": """${MODEL}""",
              "OPENROUTER_TRANSPARENT_BG": "1",
              "SMTP_HOST": """${SMTP_HOST_VAL}""",
              "SMTP_PORT": """${SMTP_PORT_VAL}""",
              "SMTP_USER": """${SMTP_USER_VAL}""",
              "SMTP_PASSWORD": """${SMTP_PASSWORD}""",
              "SMTP_FROM": """${SMTP_FROM_VAL}""",
              "FEEDBACK_TO": """${FEEDBACK_TO_VAL}""",
          }
          for k, v in updates.items():
              if v != "":
                  data[k] = v
          # Sensible defaults if never set on this host
          data.setdefault("OPENROUTER_BASE_URL", "http://91.207.75.72:8787/api/v1")
          data.setdefault("NANO_BANANA_MODEL", "google/gemini-3-pro-image-preview")
          data.setdefault("EDIT_BACKEND", "openrouter")
          text = "\n".join(f"{k}={v}" for k, v in data.items()) + "\n"
          path.write_text(text, encoding="utf-8")
          path.chmod(0o600)
          print("env keys:", ", ".join(sorted(data)))
          PY

          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd ${API_PATH} && docker compose -f ${COMPOSE_FILE} up -d --build"

      - name: Smoke health
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS http://127.0.0.1:8111/health && curl -fsS https://gosphoto.ru/health && curl -fsS https://gosphoto.ru/api/feedback"
